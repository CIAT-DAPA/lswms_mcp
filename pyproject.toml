[project]
name = "lswms-mcp"
version = "0.1.0"
description = "MCP for Waterpoints"
readme = "README.md"
authors = [
    { name = "liyunet" }
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "starlette>=0.37",
    "tenacity>=9.1.4",
    "rapidfuzz>=3.14.5",
    "numpy>=1.26",
]

[project.scripts]
lswms-mcp = "lswms_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mcp[cli]>=1.2.0,<2",
    "datamodel-code-generator>=0.25",
]
