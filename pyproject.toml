[project]
name = "lswms-mcp"
version = "0.1.0"
description = "MCP for Waterpoints"
readme = "README.md"
authors = [
    { name = "liyunet" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.4.7",
    "pandas>=3.0.5",
    "rapidfuzz>=3.14.5",
    "tenacity>=9.1.4",
]

[project.scripts]
lswms-mcp = "lswms_mcp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []
